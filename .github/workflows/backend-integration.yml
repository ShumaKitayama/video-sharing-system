name: Backend Integration Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: videoshare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d videoshare"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: Run integration tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/videoshare?sslmode=disable
          MIGRATIONS_DIR: ./migrations
        run: |
          go vet ./...
          go test ./internal/apitest/... -v -count=1
