services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: videoshare
    ports:
      - "5432:5432"
    volumes:
      - videoshare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d videoshare"]
      interval: 3s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/videoshare?sslmode=disable
      UPLOAD_DIR: /app/uploads
      MIGRATIONS_DIR: /app/migrations
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      COOKIE_SECURE: "false"
    volumes:
      - videoshare_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  videoshare_pgdata:
  videoshare_uploads:
